<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="asset_tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>asset_tracker</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Asset Tracker is built for WebAssembly (drift/sqlite native assets).
    // Browsers without WasmGC silently fall back to the JS build, which
    // crashes at startup. Detect support early and show a clear message
    // instead of a white screen.
    (function () {
      function supportsWasmGC() {
        try {
          if (typeof WebAssembly === 'undefined' || !WebAssembly.validate) {
            return false;
          }
          // WebAssembly.Function is exposed by engines with WasmGC
          // (Chrome/Edge 119+, Safari 17+, Firefox 120+).
          if (typeof WebAssembly.Function === 'function') {
            return true;
          }
          // Fallback: a minimal GC module (struct type + struct.new),
          // the same bytes used by wasm-feature-detect.
          return WebAssembly.validate(new Uint8Array([
            0, 97, 115, 109, 1, 0, 0, 0,
            1, 6, 1, 96, 0, 1, 127,
            3, 2, 1, 0,
            10, 8, 1, 6, 0, 65, 0, 252, 15, 11
          ]));
        } catch (e) {
          return false;
        }
      }
      if (!supportsWasmGC()) {
        window.addEventListener('DOMContentLoaded', function () {
          document.body.innerHTML =
            '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px;color:#333;background:#f6f7f9">' +
            '<h2 style="margin:0 0 12px">浏览器版本过旧</h2>' +
            '<p style="max-width:420px;line-height:1.6">Asset Tracker 的 Web 版需要支持 WebAssembly GC 的现代浏览器。</p>' +
            '<p style="max-width:420px;line-height:1.6">请升级到以下任一版本后重试：<br>' +
            'Chrome / Edge ≥ 119<br>Safari ≥ 17（iOS 17 及以上）<br>Firefox ≥ 120</p>' +
            '<p style="max-width:420px;line-height:1.6;color:#888;font-size:13px">也可下载 Windows 桌面版或 Android App 使用全部功能。</p>' +
            '</div>';
        });
      }
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
