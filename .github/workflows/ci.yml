name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned to the same Flutter version as the Pages deployment (pages.yml)
# so CI always validates exactly what gets deployed.
env:
  FLUTTER_VERSION: 3.44.9

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib test

      - name: Test
        run: flutter test

      - name: Server dependencies
        working-directory: server
        run: dart pub get

      - name: Server analyze
        working-directory: server
        run: dart analyze

      - name: Server test
        working-directory: server
        run: dart test

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Wasm build matches the Pages deployment exactly.
      - name: Build web (wasm)
        run: flutter build web --wasm --release --base-href=/asset-tracker/

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: web-build
          path: build/web

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build windows
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-build
          path: build/windows/x64/runner/Release

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build android (debug apk)
        run: flutter build apk --debug

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: android-build
          path: build/app/outputs/flutter-apk
