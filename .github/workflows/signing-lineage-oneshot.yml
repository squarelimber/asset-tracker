name: Signing lineage (one-shot)

# Building the proof-of-rotation lineage requires the old and the new signing
# key at once, and this machine has no JDK, so it runs here instead.
#
# Beyond creating lineage.bin this job also performs a full rehearsal:
# it downloads the v0.9.7 release APK (signed with the legacy key), re-signs it
# the exact way the release workflow will, and prints the verification result.
# The re-signed APK is uploaded so it can be tested on a real device.
#
# This workflow is temporary: delete it once the rotation is confirmed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lineage:
    name: Create lineage and rehearse re-signing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Android SDK tooling
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          echo "--- build-tools ---"
          ls -1d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* || true
          BT=$(ls -1d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* | sort -V | tail -1)
          echo "using: $BT"
          "$BT/apksigner" version
          java -version 2>&1 | head -2

      - name: Materialise signing material
        env:
          LEGACY_KEYSTORE_B64: ${{ secrets.ANDROID_LEGACY_KEYSTORE_B64 }}
          NEW_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_PK8_B64 }}
          NEW_CERT_B64: ${{ secrets.ANDROID_SIGNING_CERT_PEM_B64 }}
        run: |
          mkdir -p work
          printf '%s' "$LEGACY_KEYSTORE_B64" | base64 -d > work/legacy.keystore
          printf '%s' "$NEW_KEY_B64" | base64 -d > work/new.pk8
          printf '%s' "$NEW_CERT_B64" | base64 -d > work/new.crt
          echo "legacy.keystore $(stat -c%s work/legacy.keystore) bytes"
          echo "new.pk8         $(stat -c%s work/new.pk8) bytes"
          echo "new.crt         $(stat -c%s work/new.crt) bytes"
          echo "--- new certificate subject ---"
          openssl x509 -in work/new.crt -noout -subject -fingerprint -sha256

      - name: Create proof-of-rotation lineage
        env:
          LEGACY_PASSWORD: ${{ secrets.ANDROID_LEGACY_PASSWORD }}
          LEGACY_ALIAS: ${{ secrets.ANDROID_LEGACY_ALIAS }}
        run: |
          BT=$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" rotate \
            --out work/lineage.bin \
            --old-signer --ks work/legacy.keystore \
              --ks-key-alias "$LEGACY_ALIAS" \
              --ks-pass "pass:$LEGACY_PASSWORD" \
              --key-pass "pass:$LEGACY_PASSWORD" \
            --new-signer --key work/new.pk8 --cert work/new.crt
          echo "lineage.bin $(stat -c%s work/lineage.bin) bytes"

      - name: Fetch the v0.9.7 APK (legacy-signed)
        run: |
          curl -sSL -o work/v097.apk \
            https://github.com/squarelimber/asset-tracker/releases/download/v0.9.7/asset-tracker-arm64-v8a.apk
          echo "v097.apk $(stat -c%s work/v097.apk) bytes"
          BT=$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "--- signature of the original APK ---"
          "$BT/apksigner" verify --print-certs work/v097.apk | head -12

      - name: Re-sign with the lineage (rehearsal)
        env:
          LEGACY_PASSWORD: ${{ secrets.ANDROID_LEGACY_PASSWORD }}
          LEGACY_ALIAS: ${{ secrets.ANDROID_LEGACY_ALIAS }}
        run: |
          BT=$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cp work/v097.apk work/resigned.apk
          "$BT/apksigner" sign \
            --ks work/legacy.keystore \
            --ks-key-alias "$LEGACY_ALIAS" \
            --ks-pass "pass:$LEGACY_PASSWORD" \
            --key-pass "pass:$LEGACY_PASSWORD" \
            --next-signer --key work/new.pk8 --cert work/new.crt \
            --lineage work/lineage.bin \
            --rotation-min-sdk-version 28 \
            work/resigned.apk

      - name: Verify the re-signed APK
        run: |
          BT=$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          echo "================ v3 view (full verify) ================"
          "$BT/apksigner" verify --verbose --print-certs work/resigned.apk

          echo ""
          echo "================ v2 view of the RE-SIGNED apk (--max-sdk-version 27) ================"
          echo "must still be the LEGACY certificate, else Android <=8.1 rejects the update"
          "$BT/apksigner" verify --print-certs --max-sdk-version 27 work/resigned.apk | head -8

          echo ""
          echo "================ v2 view of the ORIGINAL v0.9.7 apk, for comparison ================"
          "$BT/apksigner" verify --print-certs --max-sdk-version 27 work/v097.apk | head -8

          echo ""
          echo "================ is the lineage embedded in the APK? ================"
          "$BT/apksigner" rotate --in work/resigned.apk --out work/lineage-from-apk.bin \
            && echo "extracted lineage: $(stat -c%s work/lineage-from-apk.bin) bytes (source lineage.bin was $(stat -c%s work/lineage.bin) bytes)" \
            || echo "!! NO LINEAGE FOUND IN THE APK !!"

          echo ""
          echo "================ sdk levels (v1 scheme absence needs minSdk >= 24) ================"
          "$BT/aapt2" dump badging work/resigned.apk 2>/dev/null | grep -E "^package:|sdkVersion|targetSdkVersion" || true

          echo ""
          echo "================ raw lineage bytes (first 64, hex) ================"
          xxd -l 64 work/lineage.bin

      - name: Upload lineage and test APK
        uses: actions/upload-artifact@v5
        with:
          name: signing-lineage-and-test-apk
          path: |
            work/lineage.bin
            work/resigned.apk
          retention-days: 3

      - name: Clean up
        if: always()
        run: rm -rf work
